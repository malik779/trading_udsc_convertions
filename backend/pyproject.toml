[project]
name = "crypto-payment-saas"
version = "0.1.0"
description = "Multi-tenant crypto payment API SaaS backend"
authors = [{ name = "Crypto Service Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "stripe>=10.0.0"
]

[tool.uvicorn]
factory = true
reload = true
host = "0.0.0.0"
port = 8080
app = "app.main:get_app"
